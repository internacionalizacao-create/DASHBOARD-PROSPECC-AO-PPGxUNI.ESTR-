<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){var t=localStorage.getItem('faap-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<title>FIND A ACADEMIC PARTNER - FAAP · Perfil do Docente UEA</title>
<link rel="stylesheet" href="css/style.css?v=29" />
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <img src="image/propespuea.svg" alt="PROPESP UEA" class="topbar__logo" />
    <img src="image/logo_internacionalizacao.png" alt="Comissão de Internacionalização da Pós-Graduação" class="topbar__logo topbar__logo--intl" />
    <div class="topbar__title">
      <strong>FIND A ACADEMIC PARTNER - FAAP</strong>
      <span>Perfil do docente UEA</span>
    </div>
  </div>

  <nav class="topbar__nav">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
    <a href="#" class="topbar__back" id="btn-back">← Voltar</a>
    <a href="index.html" class="topbar__link">Painel</a>
    <a href="ods.html" class="topbar__link">ODS</a>
    <a href="flowmap.html" class="topbar__link">Mapa de Fluxo</a>
  </nav>
</header>

<div class="statbar" id="topbar-stats"></div>

<main class="layout layout--profile">

  <!-- ===================== Coluna 1 — Pessoal ===================== -->
  <section class="col col--left">

    <div class="panel" data-help="Dados básicos do docente da UEA: nome, PPG(s) e distintivos que resumem o perfil dele.">
      <div class="profile-head">
        <div class="avatar" id="p-avatar">--</div>
        <div>
          <h1 id="p-nome">—</h1>
          <div class="muted" id="p-sub">—</div>
        </div>
      </div>
      <div class="badge-row" id="p-badges"></div>
    </div>

    <div class="panel" data-help="Informações de contato disponíveis para este docente, quando existentes.">
      <div class="panel__header"><span class="panel__title">Contato</span></div>
      <div id="p-contact"></div>
    </div>

    <div class="panel panel--grow" data-help="Linhas de pesquisa oficiais do(s) PPG(s) deste docente.">
      <div class="panel__header">
        <span class="panel__title">Linhas de pesquisa do PPG</span>
        <span class="panel__hint" id="p-linhas-hint"></span>
      </div>
      <div class="panel__body">
        <div class="kw-tags" id="p-linhas"></div>
      </div>
    </div>

    <div class="panel panel--grow" data-help="Pesquisadores estrangeiros conectados às linhas de pesquisa do(s) PPG(s) deste docente. A barra ao lado do nome (calculada aos poucos, para os 8 primeiros) mostra o grau de afinidade semântica entre a publicação mais recente deste docente e as publicações daquele pesquisador, via busca semântica do OpenAlex — quanto maior, mais parecido. Clique num nome para abrir o perfil completo dele.">
      <div class="panel__header">
        <span class="panel__title">Pesquisadores estrangeiros conectados</span>
        <span class="panel__hint" id="p-profs-hint"></span>
      </div>
      <div class="panel__body">
        <div class="picklist" id="p-profs"></div>
      </div>
    </div>

  </section>

  <!-- ===================== Coluna 2 — PPG(s) ===================== -->
  <section class="col col--center">

    <div class="panel" data-help="Programa(s) de Pós-Graduação da UEA a que este docente está vinculado, com o conceito CAPES (Avaliação Quadrienal 2021-2024) de cada um.">
      <div class="panel__header"><span class="panel__title">Programa(s) de Pós-Graduação</span></div>
      <div id="i-ppgs"></div>
    </div>

    <div class="panel panel--grow" style="min-height:220px;" data-help="Localização da Universidade do Estado do Amazonas (Manaus).">
      <div class="panel__header"><span class="panel__title">Localização</span></div>
      <div class="panel__body" id="institution-map"></div>
    </div>

  </section>

  <!-- ===================== Coluna 3 — Publicações ===================== -->
  <section class="col col--right">

    <div class="panel panel--grow" data-help="Publicações mais recentes deste docente, via ORCID/OpenAlex — só disponível quando o ORCID está cadastrado na planilha de docentes.">
      <div class="panel__header">
        <span class="panel__title">Publicações</span>
        <span class="panel__hint" id="pub-hint">via OpenAlex</span>
      </div>
      <div class="panel__body" id="pub-list">
        <div class="skeleton" style="width:95%;"></div>
        <div class="skeleton" style="width:70%;"></div>
        <div class="skeleton" style="width:85%; margin-top:16px;"></div>
        <div class="skeleton" style="width:60%;"></div>
      </div>
    </div>

  </section>

</main>

<footer class="site-credit">Powered by William Pinheiro</footer>

<script src="lib/d3.v7.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="js/common.js?v=27"></script>
<script src="js/charts.js?v=27"></script>
<script src="js/docente.js?v=27"></script>
</body>
</html>
